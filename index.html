<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>⚡ РНЗ ТВ — Цифровой Телеканал</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--bg:#0a0a0f;--bg2:#111118;--bg-card:rgba(18,18,28,0.8);--bg-glass:rgba(18,18,28,0.6);--text:#f0f0f5;--text2:#a0a0b5;--text3:#6b6b80;--accent:#e53935;--accent-glow:rgba(229,57,53,0.3);--accent-purple:#af52de;--accent-orange:#ff9500;--accent-green:#34c759;--border:rgba(255,255,255,0.06);--border-active:rgba(255,255,255,0.12);--shadow-sm:0 2px 8px rgba(0,0,0,0.3);--shadow-md:0 8px 32px rgba(0,0,0,0.5);--shadow-lg:0 20px 60px rgba(0,0,0,0.7);--radius-sm:10px;--radius:14px;--radius-lg:20px;--radius-xl:28px;--radius-full:9999px;--transition:0.3s cubic-bezier(0.25,0.1,0.25,1);--font:'Inter',system-ui,-apple-system,sans-serif;--safe-bottom:env(safe-area-inset-bottom,16px)}
        [data-theme="light"]{--bg:#f2f2f7;--bg2:#fff;--bg-card:rgba(255,255,255,0.85);--bg-glass:rgba(255,255,255,0.7);--text:#1c1c1e;--text2:#6e6e7a;--text3:#aeaeb8;--accent:#e53935;--accent-glow:rgba(229,57,53,0.2);--border:rgba(0,0,0,0.06);--border-active:rgba(0,0,0,0.12);--shadow-sm:0 2px 8px rgba(0,0,0,0.06);--shadow-md:0 8px 32px rgba(0,0,0,0.1);--shadow-lg:0 20px 60px rgba(0,0,0,0.15)}
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{background:var(--bg);font-family:var(--font);color:var(--text);min-height:100vh;line-height:1.5;overflow-x:hidden;transition:background 0.5s,color 0.5s;-webkit-font-smoothing:antialiased}
        .bg-parallax{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 30% 15%,var(--accent-glow) 0%,transparent 55%),radial-gradient(ellipse at 70% 50%,rgba(175,82,222,0.12) 0%,transparent 50%),radial-gradient(ellipse at 50% 85%,rgba(0,122,255,0.08) 0%,transparent 50%)}
        .app-container{max-width:1200px;margin:0 auto;padding:12px 16px calc(80px + var(--safe-bottom));position:relative;z-index:1}
        .header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 20px;background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:14px;position:sticky;top:10px;z-index:90;box-shadow:var(--shadow-sm);transition:all var(--transition)}
        .header-scrolled{box-shadow:var(--shadow-md);border-color:var(--border-active)}
        .logo-section{display:flex;align-items:center;gap:12px}
        .logo-icon{width:48px;height:48px;background:linear-gradient(135deg,#1a0000,#330000);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #ff1a1a;box-shadow:0 0 10px #ff1a1a,0 0 30px #ff0000,0 0 60px #cc0000;animation:logoGlow 2s infinite,logoFloat 4s infinite;position:relative}
        .logo-live-dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;background:#ff1a1a;border-radius:50%;border:2px solid #000;animation:livePulse 1.5s infinite}
        @keyframes logoGlow{0%,100%{box-shadow:0 0 10px #ff1a1a,0 0 30px #ff0000,0 0 60px #cc0000}50%{box-shadow:0 0 20px #f33,0 0 50px #ff1a1a,0 0 80px #ff0000}}
        @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
        @keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(1.3)}}
        .logo-text{line-height:1.2}
        .logo-title{font-size:22px;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(135deg,#ff1a1a,#f66);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .logo-subtitle{font-size:11px;color:var(--text3);font-weight:500}
        .logo-live-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(229,57,53,0.15);border:1px solid #ff1a1a;padding:3px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:800;color:#ff1a1a;margin-left:6px;animation:livePulse 1.5s infinite}
        .logo-live-badge .live-dot{width:6px;height:6px;background:#ff1a1a;border-radius:50%;animation:livePulse 0.8s infinite}
        .status-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;margin-left:6px;transition:all var(--transition)}
        .status-dot.online{background:var(--accent-green);box-shadow:0 0 8px var(--accent-green)}
        .header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .search-wrap{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-full);padding:7px 8px 7px 16px;gap:8px;transition:all var(--transition);position:relative}
        .search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
        .search-icon{color:var(--text3);font-size:14px}
        .search-input{background:none;border:none;color:var(--text);font-size:14px;outline:none;width:140px;font-family:var(--font)}
        .search-input::placeholder{color:var(--text3)}
        .search-clear{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:2px 8px;border-radius:50%;display:none}
        .search-clear:hover{color:var(--accent)}
        .search-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--bg-glass);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius);margin-top:6px;padding:8px 0;z-index:200;display:none;max-height:300px;overflow-y:auto}
        .search-suggestions.show{display:block}
        .search-suggestion-item{padding:10px 16px;cursor:pointer;font-size:13px;color:var(--text2);transition:all 0.15s;display:flex;justify-content:space-between}
        .search-suggestion-item:hover{background:var(--border);color:var(--text)}
        .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--text2);border:1px solid var(--border);background:var(--bg2);transition:all var(--transition);flex-shrink:0}
        .icon-btn:hover{color:var(--accent);border-color:var(--accent);box-shadow:0 0 16px var(--accent-glow)}
        .icon-btn.active-btn{background:var(--accent);color:#fff;border-color:var(--accent)}
        .tabs-scroll{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
        .tabs-scroll::-webkit-scrollbar{display:none}
        .tab{padding:9px 14px;border-radius:var(--radius-full);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-family:var(--font);transition:all var(--transition);display:flex;align-items:center;gap:5px;flex-shrink:0}
        .tab:hover{border-color:var(--border-active);color:var(--text)}
        .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 16px var(--accent-glow)}
        .tab-content{display:none;animation:fadeSlide 0.35s ease}
        .tab-content.active{display:block}
        @keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .world-filters,.voice-settings{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
        .world-filters button,.voice-settings select{padding:7px 14px;border-radius:var(--radius-full);font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-family:var(--font);transition:all var(--transition);white-space:nowrap}
        .world-filters button:hover,.voice-settings select:hover{border-color:var(--border-active);color:var(--text)}
        .world-filters button.active{background:var(--accent);border-color:var(--accent);color:#fff}
        .voice-settings select{outline:none;cursor:pointer}
        .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
        .card{background:var(--bg-card);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:all var(--transition);position:relative;opacity:0;transform:translateY(20px)}
        .card.visible{opacity:1;transform:translateY(0)}
        .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
        .card-image{width:100%;aspect-ratio:16/10;background:linear-gradient(135deg,#1a1a2e,#16213e);overflow:hidden;position:relative}
        .card-image img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s ease;opacity:0}
        .card-image img.loaded{opacity:1}
        .card:hover .card-image img.loaded{transform:scale(1.05)}
        .card-badge{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:700;text-transform:uppercase;color:#fff;z-index:2}
        .badge-regular{background:rgba(0,0,0,0.55)}.badge-emergency{background:var(--accent);animation:badgePulse 1.5s infinite}.badge-shocking{background:var(--accent-orange);animation:badgePulse 1s infinite}.badge-prediction{background:var(--accent-purple)}.badge-critical{background:var(--accent);animation:badgePulse 0.5s infinite}.badge-important{background:var(--accent-orange)}.badge-medium{background:#fbbf24;color:#000}.badge-low{background:#888}
        @keyframes badgePulse{0%,100%{opacity:1}50%{opacity:0.55}}
        .card-importance{position:absolute;top:10px;right:10px;padding:3px 8px;border-radius:var(--radius-full);font-size:9px;font-weight:700;color:#fff;z-index:2}
        .card-body{padding:14px 16px 16px}
        .card-cat{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;color:var(--accent)}
        .card-title{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .card-desc{font-size:12.5px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
        .card-footer{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text3);gap:8px;flex-wrap:wrap}
        .card-source{color:var(--accent);font-weight:600}
        .card-region{font-size:10px;padding:2px 8px;border-radius:var(--radius-full);background:var(--border)}
        .vote-panel{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
        .vote-btn{padding:4px 10px;border-radius:var(--radius-full);font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-family:var(--font);transition:all 0.15s;display:flex;align-items:center;gap:3px}
        .vote-btn:hover{border-color:var(--accent);color:var(--accent)}
        .vote-btn.voted{background:var(--accent);color:#fff;border-color:var(--accent)}
        .vote-results{display:flex;gap:4px;font-size:9px;color:var(--text3);margin-left:auto}
        .vote-bar{height:3px;border-radius:2px;margin-top:2px}
        .highlight{background:rgba(229,57,53,0.3);border-radius:3px;padding:0 2px}
        .skeleton{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;animation:skeletonPulse 1.5s infinite}
        .skeleton-image{width:100%;aspect-ratio:16/10;background:var(--border)}
        .skeleton-body{padding:14px 16px}
        .skeleton-line{height:12px;background:var(--border);border-radius:4px;margin-bottom:8px}
        .skeleton-line.short{width:60%}.skeleton-line.medium{width:85%}
        @keyframes skeletonPulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .empty-state{text-align:center;padding:80px 20px;grid-column:1/-1;color:var(--text3)}
        .empty-state i{font-size:56px;margin-bottom:14px;color:var(--accent);opacity:0.4}
        .empty-state h3{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text)}
        .btn-load{display:block;margin:28px auto;padding:13px 40px;border-radius:var(--radius-full);font-size:14px;font-weight:700;cursor:pointer;border:2px solid var(--accent);background:transparent;color:var(--accent);font-family:var(--font);transition:all var(--transition)}
        .btn-load:hover{background:var(--accent);color:#fff;box-shadow:0 8px 28px var(--accent-glow)}
        .footer-bar{display:flex;justify-content:center;gap:20px;padding:14px 20px;background:var(--bg-glass);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:20px;font-size:12px;color:var(--text3);flex-wrap:wrap}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:9999;justify-content:center;align-items:center;padding:16px}
        .modal-overlay.open{display:flex}
        .modal{max-width:700px;width:100%;max-height:90vh;overflow-y:auto;border-radius:var(--radius-xl);padding:28px;background:var(--bg-glass);backdrop-filter:blur(30px);border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:modalIn 0.3s ease}
        @keyframes modalIn{from{transform:translateY(24px) scale(0.96);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
        .modal-close{float:right;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
        .modal-close:hover{background:var(--accent);color:#fff}
        .modal-title{font-size:24px;font-weight:800;line-height:1.3;margin:10px 0}
        .modal-desc{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:14px}
        .modal-meta{display:flex;gap:16px;font-size:12px;color:var(--text3);flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:14px}
        .modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
        .btn-action{padding:10px 18px;border-radius:var(--radius-full);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;font-family:var(--font);border:1px solid var(--border);background:var(--bg2);color:var(--text);display:flex;align-items:center;gap:5px;transition:all var(--transition)}
        .btn-action:hover{border-color:var(--border-active)}
        .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
        .btn-primary:hover{box-shadow:0 6px 20px var(--accent-glow)}
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--accent);padding:10px 22px;border-radius:var(--radius-full);font-weight:600;font-size:13px;z-index:99999;transition:transform 0.35s ease;color:var(--text);white-space:nowrap}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-glass);backdrop-filter:blur(24px);border-top:1px solid var(--border);z-index:100;padding:6px 8px calc(6px + var(--safe-bottom));justify-content:space-around}
        .bottom-nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:var(--font);font-size:10px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm)}
        .bottom-nav-btn i{font-size:18px}
        .bottom-nav-btn.active{color:var(--accent)}
        .tv-overlay{display:none;position:fixed;inset:0;background:#000;z-index:10000;flex-direction:column;align-items:center;justify-content:center}
        .tv-overlay.active{display:flex}
        .tv-container{width:100%;height:100%;position:relative;overflow:hidden;background:#000}
        .tv-globe-intro{position:absolute;inset:0;background:radial-gradient(circle at center,#000,#050510);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
        .globe{width:140px;height:140px;border-radius:50%;background:url('https://upload.wikimedia.org/wikipedia/commons/2/2c/Rotating_earth_%28large%29.gif');background-size:cover;box-shadow:0 0 40px #00aaff,0 0 80px #0033ff;animation:globePulse 2s infinite}
        @keyframes globePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
        .globe-text{margin-top:20px;color:#fff;font-size:14px;opacity:0.8;letter-spacing:1px;animation:fadeIn 1.5s ease}
        .tv-intro{position:absolute;inset:0;background:linear-gradient(135deg,#0a0000,#1a0000,#0a0000);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
        .tv-intro-logo{font-size:80px;animation:logoFloat 2s infinite}
        .tv-intro-title{font-size:48px;font-weight:900;color:var(--accent);margin-top:16px;animation:fadeIn 1s ease;text-shadow:0 0 30px var(--accent)}
        .tv-intro-subtitle{font-size:18px;color:#fff;opacity:0.7;margin-top:8px;animation:fadeIn 1.5s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .tv-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;opacity:0;transition:opacity 0.8s ease;transform:scale(1.05)}
        .tv-card.active{opacity:1;transform:scale(1)}
        .tv-card img{max-width:90%;max-height:45vh;object-fit:contain;border-radius:var(--radius-lg)}
        .tv-card .tv-title{font-size:28px;font-weight:900;text-align:center;margin-top:20px;color:#fff;max-width:800px}
        .tv-card .tv-source{font-size:14px;color:var(--accent);margin-top:10px}
        .tv-live-badge{position:absolute;top:20px;left:20px;background:var(--accent);color:#fff;padding:8px 20px;border-radius:var(--radius-full);font-weight:800;font-size:14px;animation:badgePulse 1s infinite;z-index:10;display:flex;align-items:center;gap:8px}
        .tv-live-dot{width:10px;height:10px;background:#fff;border-radius:50%}
        .tv-stream-badge{position:absolute;top:20px;right:80px;background:rgba(0,170,255,0.8);color:#fff;padding:6px 14px;border-radius:var(--radius-full);font-weight:700;font-size:12px;z-index:10;animation:badgePulse 1.5s infinite}
        .tv-controls{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10}
        .tv-btn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
        .tv-btn:hover{background:var(--accent)}
        .tv-close{position:absolute;top:20px;right:20px;z-index:10;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center}
        .tv-close:hover{background:var(--accent)}
        .tv-progress{position:absolute;bottom:0;left:0;height:3px;background:var(--accent)}
        .speech-panel{position:fixed;bottom:20px;right:20px;display:flex;gap:6px;z-index:9998;background:var(--bg-glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius-full);padding:6px}
        .speech-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
        .speech-btn:hover{color:var(--accent);border-color:var(--accent)}
        .speech-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .stream-card{padding:40px;text-align:center;animation:fadeSlide 0.5s ease}
        .stream-card h2{font-size:32px;font-weight:900;margin-bottom:16px}
        .stream-card p{font-size:16px;color:var(--text2);max-width:700px;margin:0 auto}
        @media(max-width:768px){.news-grid{grid-template-columns:1fr}.header{padding:10px 14px;border-radius:var(--radius)}.search-input{width:100px}.modal{padding:18px 14px}.modal-title{font-size:19px}.bottom-nav{display:flex}.app-container{padding-bottom:calc(90px + var(--safe-bottom))}.tab{padding:7px 10px;font-size:10px}.logo-title{font-size:18px}.tv-card .tv-title{font-size:20px}.tv-intro-title{font-size:32px}.tv-intro-logo{font-size:50px}.speech-panel{bottom:100px;right:10px}.stream-card h2{font-size:22px}.globe{width:100px;height:100px}}
    </style>
</head>
<body data-theme="dark">
<div class="bg-parallax" id="bgParallax"></div>
<div class="app-container" id="appContainer">
    <header class="header" id="header">
        <div class="logo-section">
            <div class="logo-icon">📡<div class="logo-live-dot"></div></div>
            <div class="logo-text"><span class="logo-title">⚡ РНЗ ТВ</span><span class="logo-subtitle">Цифровой Телеканал <span class="logo-live-badge"><span class="live-dot"></span> LIVE</span></span></div>
            <span class="status-dot" id="statusDot"></span>

(()=>{

    CATEGORIES:['Экономика','В России','В мире','Политика','Спорт','Криминал','Происшествия','Здоровье','СВО','Технологии','Наука'],

class StorageManager{

static getFavorites(){return StorageManager.get('favorites',[])}

static getViews(){return StorageManager.get('views',{})}
static incrementView(id){const v=StorageManager.getViews();v[id]=(v[id]||0)+1;StorageManager.set('views',v);return v[id]}
static getVotes(){return StorageManager.get('votes',{})}
static addVote(id,type){const v=StorageManager.getVotes();if(!v[id])v[id]={important:0,neutral:0,unimportant:0};v[id][type]=(v[id][type]||0)+1;StorageManager.set('votes',v);return v[id]}
static getUserVote(id){const uv=StorageManager.get('user_votes',{});return uv[id]||null}
static setUserVote(id,type){const uv=StorageManager.get('user_votes',{});uv[id]=type;StorageManager.set('user_votes',uv)}
static getHidden(){return StorageManager.get('hidden',[])}
static toggleHidden(id){const h=StorageManager.getHidden();const i=h.indexOf(id);i>-1?h.splice(i,1):h.push(id);StorageManager.set('hidden',h);return h}

static addSearchHistory(q){if(!q.trim())return;let h=StorageManager.getSearchHistory();h=h.filter(s=>s!==q);h.unshift(q);if(h.length>10)h=h.slice(0,10);StorageManager.set('search_history',h)}
static getCache(k){const c=StorageManager.get('rss_cache',{});const e=c[k];if(e&&Date.now()-e.time<600000)return e.data;return null}
static setCache(k,d){const c=StorageManager.get('rss_cache',{});c[k]={data:d,time:Date.now()};StorageManager.set('rss_cache',c)}

}
const state={allNews:[],isLoading:false,currentCategory:'all',currentSort:'date-desc',searchQuery:'',currentRegion:'all',importantMode:false,filteredNews:[],displayedNews:[],autoRefreshTimer:null,currentModalNews:null,tvTimer:null,tvPaused:false,tvIndex:0,tvNews:[],isStreamMode:false,streamIndex:0,streamTimer:null,speechEnabled:true,speechPaused:false,infiniteScrollObserver:null,page:1,currentVoice:'male'};
const dom={};const cacheDom=()=>{['newsGrid','categoriesScroll','totalCount','shownCount','searchInput','searchClear','statusDot','modalOverlay','toast','themeToggle','sortBar','header','bgParallax','bottomNav','tabsScroll','worldGrid','summaryContainer','broadcastContainer','streamContainer','searchWrap','searchSuggestions','tvOverlay','tvContainer','tvCard','tvProgress','tvPause','tvNext','tvPrev','tvOpenNews','tvCloseBtn','startTVBtn','startTVShowBtn','tvGlobeIntro','tvIntro','tvStreamBadge','worldFilters','voiceSettings','voiceSelector','importantModeBtn','speechPanel','speechToggle','speechPause','speechResume'].forEach(id=>{dom[id]=document.getElementById(id)});dom.modalCloseBtn=document.getElementById('modalCloseBtn');dom.modalBadge=document.getElementById('modalBadge');dom.modalImage=document.getElementById('modalImage');dom.modalCat=document.getElementById('modalCat');dom.modalTitle=document.getElementById('modalTitle');dom.modalDesc=document.getElementById('modalDesc');dom.modalDate=document.getElementById('modalDate');dom.modalSource=document.getElementById('modalSource');dom.modalViews=document.getElementById('modalViews');dom.modalReadMore=document.getElementById('modalReadMore');dom.modalFavBtn=document.getElementById('modalFavBtn');dom.modalShareBtn=document.getElementById('modalShareBtn');dom.refreshBtn=document.getElementById('refreshBtn')};
const sanitize=s=>{if(!s)return'';return s.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim()};
const escapeHTML=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const formatDate=ds=>{if(!ds)return'Сегодня';const d=new Date(ds+'T00:00:00');if(isNaN(d.getTime()))return'Сегодня';const diff=Math.floor((Date.now()-d.getTime())/86400000);if(diff===0)return'Сегодня';if(diff===1)return'Вчера';if(diff<7){const w=['день','дня','дней'];const n=diff%10;return`${diff} ${n===1?w[0]:n>=2&&n<=4?w[1]:w[2]} назад`}return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})};
const detectCategory=t=>{const tx=t.toLowerCase();if(/экономик|рубл|доллар|инфляц|ставк|бирж|ввп|нефт/.test(tx))return'Экономика';if(/политик|путин|закон|госдум|выбор|депутат|правительств/.test(tx))return'Политика';if(/спорт|чемпионат|футбол|хоккей|олимпиад|матч/.test(tx))return'Спорт';if(/криминал|убийств|ограблен|суд |задержан|приговор/.test(tx))return'Криминал';if(/происшеств|дтп|пожар|авар|катастроф|наводнен/.test(tx))return'Происшествия';if(/здоров|лекарств|больниц|врач|вакцин|вирус/.test(tx))return'Здоровье';if(/сво|спецоперац|военн|оборон|миноборон|фронт/.test(tx))return'СВО';if(/технолог|нейросет|робот|гаджет|смартфон/.test(tx))return'Технологии';if(/наук|исследован|учён|открыти|космос/.test(tx))return'Наука';if(/загадк|тайн|неразгадан/.test(tx))return'Загадки';if(/конфликт|столкновен|обострен|санкц/.test(tx))return'Конфликты';if(/аномал|нло|сверхъестествен|необъясним/.test(tx))return'Аномалии';return'В России'};
const detectRegion=t=>{const tx=t.toLowerCase();for(const[r,words]of Object.entries(CONFIG.REGIONS)){if(words.some(w=>tx.includes(w)))return r}return'world'};
const getImportanceScore=n=>{const feed=CONFIG.RSS_FEEDS.find(f=>f.name===n.source);const rep=feed?feed.reputation:70;const confirmations=state.allNews.filter(x=>x.id!==n.id&&x.title.toLowerCase().includes(n.title.toLowerCase().slice(0,30))).length;const popularity=StorageManager.getViews()[n.id]||0;const votes=StorageManager.getVotes()[n.id];const voteScore=votes?Math.round(((votes.important||0)/(Object.values(votes).reduce((a,b)=>a+b,1)||1))*100):0;return Math.round(rep*0.4+Math.min(confirmations*10,30)*0.3+Math.min(popularity,50)*0.4+voteScore*0.1)};
const getImportanceClass=s=>{if(s>=90)return'badge-critical';if(s>=75)return'badge-important';if(s>=50)return'badge-medium';return'badge-low'};
const getImportanceLabel=s=>{if(s>=90)return'🔴 Критически важно';if(s>=75)return'🟠 Важно';if(s>=50)return'🟡 Средне';return'⚪ Обычное'};
const getTrustScore=n=>{const feed=CONFIG.RSS_FEEDS.find(f=>f.name===n.source);const rep=feed?feed.reputation:70;const similarCount=state.allNews.filter(x=>x.id!==n.id&&(x.title.toLowerCase().includes(n.title.toLowerCase().slice(0,30))||n.title.toLowerCase().includes(x.title.toLowerCase().slice(0,30)))).length;const trust=Math.min(100,Math.round(rep*0.7+similarCount*8));let status='unverified',statusText='🔴 Требует проверки';if(trust>=85){status='confirmed';statusText='🟢 Подтверждено'}else if(trust>=65){status='partial';statusText='🟡 Частично подтверждено'}return{reputation:rep,similarCount,trust,status,statusText}};
const speakChannel=(text,voiceType=null)=>{if(!state.speechEnabled||state.speechPaused)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';const vt=voiceType||state.currentVoice;switch(vt){case'male':u.rate=1.0;u.pitch=0.8;break;case'female':u.rate=1.0;u.pitch=1.2;break;case'studio':u.rate=0.9;u.pitch=1.0;break;case'breaking':u.rate=1.15;u.pitch=1.0;break;default:u.rate=1.0;u.pitch=1.0}window.speechSynthesis.speak(u)};
const showToast=(msg,dur=2500)=>{dom.toast.textContent=msg;dom.toast.classList.add('show');clearTimeout(dom.toast._t);dom.toast._t=setTimeout(()=>dom.toast.classList.remove('show'),dur)};
const setStatus=on=>{dom.statusDot.className='status-dot'+(on?' online':'')};
const debounce=(fn,ms)=>{let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}};
const applyFilters=(arr=state.allNews)=>{let r=[...arr];const hiddenSources=StorageManager.getHiddenSources();r=r.filter(n=>!StorageManager.isHidden(n.id)&&!hiddenSources.includes(n.source));if(state.currentRegion!=='all'&&state.currentRegion){r=r.filter(n=>n.region===state.currentRegion)}if(state.importantMode){r=r.filter(n=>getImportanceScore(n)>=75)}if(state.currentCategory!=='all')r=r.filter(n=>n.category===state.currentCategory);if(state.searchQuery.trim()){const q=state.searchQuery.trim().toLowerCase();r=r.filter(n=>n.title.toLowerCase().includes(q)||n.desc.toLowerCase().includes(q)||n.category.toLowerCase().includes(q)||n.source.toLowerCase().includes(q))}if(state.currentSort==='date-desc')r.sort((a,b)=>b.timestamp-a.timestamp);else if(state.currentSort==='date-asc')r.sort((a,b)=>a.timestamp-b.timestamp);else if(state.currentSort==='popular')r.sort((a,b)=>(StorageManager.getViews()[b.id]||0)-(StorageManager.getViews()[a.id]||0));return r};
const updateDisplayed=(reset=true)=>{state.filteredNews=applyFilters();if(reset){state.page=1;state.displayedNews=state.filteredNews.slice(0,CONFIG.PAGE_SIZE)}else{state.page++;state.displayedNews=state.filteredNews.slice(0,state.page*CONFIG.PAGE_SIZE)}};
const updateStats=()=>{dom.totalCount.textContent=state.filteredNews.length;dom.shownCount.textContent=state.displayedNews.length};
const createCard=n=>{const trust=getTrustScore(n);const importance=getImportanceScore(n);const impClass=getImportanceClass(importance);const votes=StorageManager.getVotes()[n.id];const totalVotes=votes?Object.values(votes).reduce((a,b)=>a+b,0):0;const userVote=StorageManager.getUserVote(n.id);let badgeText='📡',badgeClass='badge-regular';if(n.isEmergency){badgeText='⚡ ЭКСТРЕННО';badgeClass='badge-emergency'}if(n.isShocking){badgeText='⚡ ШОК';badgeClass='badge-shocking'}if(n.isPrediction){badgeText='🔮';badgeClass='badge-prediction'}const titleHTML=state.searchQuery?highlightText(n.title,state.searchQuery):escapeHTML(n.title);const descHTML=state.searchQuery?highlightText(n.desc.slice(0,100),state.searchQuery):escapeHTML(n.desc.slice(0,100));return`<div class="card" data-id="${n.id}"><div class="card-image"><img data-src="${n.image}" alt="" loading="lazy" onerror="this.parentElement.style.background='linear-gradient(135deg,#1a1a2e,#0f0f1a)';this.style.display='none';"><span class="card-badge ${badgeClass}">${badgeText}</span><span class="card-importance ${impClass}">${importance}/100</span></div><div class="card-body"><div class="card-cat">${n.category} ${n.region?`<span class="card-region">${n.region}</span>`:''}</div><div class="card-title">${titleHTML}</div><div class="card-desc">${descHTML}...</div><div class="card-footer"><span>📅 ${formatDate(n.date)}</span><span class="card-source">${n.source}</span><span>Доверие: ${trust.trust}%</span></div><div class="vote-panel"><button class="vote-btn${userVote==='important'?' voted':''}" data-vote="important" data-id="${n.id}">👍 Важно${totalVotes>0?` ${Math.round(((votes?.important||0)/totalVotes)*100)}%`:''}</button><button class="vote-btn${userVote==='neutral'?' voted':''}" data-vote="neutral" data-id="${n.id}">😐 Нейтр.</button><button class="vote-btn${userVote==='unimportant'?' voted':''}" data-vote="unimportant" data-id="${n.id}">👎 Неинт.</button></div></div></div>`};

{const d=e.changedTouches[0].clientX-touchStartX;if(Math.abs(d)<50)return;const tabs=[...document.querySelectorAll('.tab')].map(t=>t.dataset.tab);const at=document.querySelector('.tab.active')?.dataset?.tab||'main';const idx=tabs.indexOf(at);const next=d<0?Math.min(idx+1,tabs.length-1):Math.max(idx-1,0);if(tabs[next])switchTab(tabs[next])})};
const init=()=>{cacheDom();const theme=StorageManager.getTheme();document.body.setAttribute('data-theme',theme);dom.themeToggle.innerHTML=theme==='dark'?'<i class="fas fa-moon"></i>':'<i class="fas fa-sun"></i>';state.currentVoice=StorageManager.getVoice();dom.voiceSelector.value=state.currentVoice;setupEvents();fetchRSS()};
